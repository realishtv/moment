# .github/workflows/deploy.yml

name: Build and Deploy Moment Client to GitHub Pages

on:
  push:
    branches: ["client"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Client Code
        uses: actions/checkout@v4
        with:
          ref: client

      # --- NEW STEP: Get the repository name ---
      # This step extracts the repo name (e.g., "my-moment-notes") from the full
      # GITHUB_REPOSITORY variable (e.g., "username/my-moment-notes").
      - name: Get repository name
        run: echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- MODIFIED STEP: Pass the repo name to the build ---
      - name: Build Static Site
        run: npm run build
        env:
          # VITE_ is a special prefix that Vite uses to expose env vars to the build script.
          # We are setting VITE_APP_BASE to the REPO_NAME we extracted in the previous step.
          VITE_APP_BASE: ${{ env.REPO_NAME }}

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4